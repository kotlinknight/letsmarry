openapi: 3.0.3
info:
  title: Make My Marriage API
  version: 1.0.0-1d-c
  description: Stage 1D-C adds local/test-only password reset and durable session revocation.
servers:
  - url: /api/v1
paths:
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrf
      summary: Create an anonymous session and obtain its CSRF token
      description: >-
        Available independently of registration and outbox gates. The browser must retain the
        HttpOnly SESSION cookie and send the returned token in the named header on unsafe account requests.
        The response must not be cached. An anonymous CSRF session does not authenticate the user.
      security: []
      responses:
        '200':
          description: CSRF token and anonymous session cookie
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Set-Cookie:
              description: HttpOnly SESSION cookie; Secure over HTTPS, local HTTP exception only.
              schema:
                type: string
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
              example:
                token: opaque-csrf-token
                headerName: X-CSRF-TOKEN
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Authenticate a verified active account
      description: >-
        Requires the anonymous SESSION cookie and CSRF header from GET /auth/csrf. The
        authentication feature gate is disabled by default and independent of public
        registration. On success Spring Security rotates the session ID, stores the
        authenticated session in Redis, and clears the pre-login CSRF token. Fetch
        GET /auth/csrf again before another unsafe request. Unknown email, incorrect
        password, unverified email, suspended and deactivated accounts share one
        generic 401 response. No password hash or session credential is returned in JSON.
      security:
        - anonymousSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated Redis-backed session established.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Set-Cookie:
              description: Rotated HttpOnly SESSION cookie; Secure over HTTPS.
              schema:
                type: string
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          description: Authentication feature gate is disabled; endpoint absent.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/AuthenticationRateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: Invalidate the current browser session
      description: >-
        Requires a valid CSRF token. Invalidates only the current Redis session, clears
        Spring Security authentication and the old CSRF state, and expires the SESSION
        cookie. A repeated request with a newly bootstrapped anonymous session and valid
        CSRF token also returns 204. The old CSRF token cannot be reused after logout.
      security:
        - anonymousSession: []
          csrfHeader: []
      responses:
        '204':
          description: Current session invalidated, or no authenticated session remained.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Set-Cookie:
              description: Expired SESSION cookie.
              schema:
                type: string
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Read the current eligible account from PostgreSQL
      description: >-
        Requires an authenticated Redis session. Account standing and email verification
        are revalidated against PostgreSQL before the response. Expired, invalidated,
        ineligible, or missing accounts receive 401; an ineligible session is invalidated.
        The response uses fresh account data and must not be cached.
      security:
        - authenticatedSession: []
      responses:
        '200':
          description: Current account details.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /auth/register:
    post:
      tags: [Registration]
      operationId: registerUser
      summary: Create an unverified account
      description: >-
        Available only in local/test when app.registration.enabled and app.email-outbox.enabled are true.
        Requires an anonymous SESSION cookie and its CSRF token. Atomically creates an
        unverified user, hash-only verification token, and encrypted email-outbox job.
        No authenticated session, wedding, or ownership is created. Delivery is deferred
        to the separately enabled outbox worker; it never occurs in this HTTP transaction.
      security:
        - anonymousSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              displayName: Anjali
              email: anjali@example.com
              password: SecurePassword123!
      responses:
        '201':
          description: Unverified user created; no authenticated session is established.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
              example:
                id: 0199d4ee-26ad-7000-9000-000000000001
                displayName: Anjali
                email: anjali@example.com
                emailVerified: false
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          $ref: '#/components/responses/DuplicateEmail'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Registration gate is disabled, so the endpoint is absent.
  /auth/email/verify:
    post:
      tags: [Email verification]
      operationId: verifyEmail
      summary: Consume an email verification token
      description: >-
        Local/test only with registration and outbox gates enabled. Requires the anonymous
        SESSION cookie and matching CSRF header. Valid, unused tokens set email_verified_at
        and are consumed atomically; account status remains ACTIVE. No login is created.
      security:
        - anonymousSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
      responses:
        '204':
          description: Email verified; no response body or authenticated session.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/InvalidVerificationToken'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          description: Feature gate disabled; endpoint absent.
        '429':
          $ref: '#/components/responses/VerificationRateLimited'
        '503':
          $ref: '#/components/responses/VerificationUnavailable'
  /auth/email/verification-requests:
    post:
      tags: [Email verification]
      operationId: requestEmailVerification
      summary: Request a new verification link
      description: >-
        Local/test only with registration and outbox gates enabled. Always returns 202 for
        syntactically valid email, whether the account exists or is eligible. An eligible
        unverified ACTIVE account receives a replacement token and encrypted outbox job
        atomically. Earlier tokens are revoked and pending jobs purged when safe; an email
        already in flight can still arrive with an unusable link. Email-specific cooldown
        and daily limits keep the same 202 response; IP-wide excess returns 429. Redis
        outages fail closed with 503.
      security:
        - anonymousSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationEmailRequest'
      responses:
        '202':
          description: Request accepted without account disclosure; no response body.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          description: Feature gate disabled; endpoint absent.
        '422':
          $ref: '#/components/responses/VerificationEmailValidationError'
        '429':
          $ref: '#/components/responses/VerificationRateLimited'
        '503':
          $ref: '#/components/responses/VerificationUnavailable'
  /auth/password/forgot:
    post:
      tags: [Password recovery]
      operationId: requestPasswordReset
      summary: Request a password-reset email without disclosing account existence
      description: >-
        Local/test only when the independent password-recovery and existing email-outbox
        gates are enabled. Requires the anonymous SESSION cookie and matching CSRF header.
        A valid email always receives an empty 202, including unknown, unverified, suspended,
        deactivated, and email-limited accounts. An eligible account receives a 30-minute
        hash-only reset token and an encrypted PASSWORD_RESET outbox job in one transaction.
        Replacement revokes the old token and purges an older pending job; an in-flight
        email may still arrive with an unusable link. The configured frontend link carries
        the token in its URL fragment. No password or authenticated session changes here.
        A minimum response duration reduces obvious account-existence timing differences.
      security:
        - anonymousSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request accepted without account disclosure; no response body.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          description: Password-recovery or outbox feature gate is disabled; endpoint absent.
        '422':
          $ref: '#/components/responses/ForgotPasswordValidationError'
        '429':
          $ref: '#/components/responses/PasswordRecoveryRateLimited'
        '503':
          $ref: '#/components/responses/PasswordRecoveryUnavailable'
  /auth/password/reset:
    post:
      tags: [Password recovery]
      operationId: resetPassword
      summary: Consume a reset token and change the account password
      description: >-
        Local/test only with independent password-recovery and email-outbox gates.
        Requires a SESSION cookie and CSRF header. A valid single-use 30-minute token
        for a verified ACTIVE account atomically changes the NFC-normalized PBKDF2
        password hash, consumes the token, increments users.auth_version, and enqueues
        a PASSWORD_CHANGED notification. All older authenticated sessions are rejected
        by PostgreSQL version comparison; indexed Redis cleanup after commit is best effort.
        The request does not authenticate the caller. Reset attempts are limited to
        20 per direct IP per hour by default.
      security:
        - anonymousSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed; no automatic login and no response body.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          description: Malformed JSON or invalid, expired, revoked, ineligible, or used token; generic Problem Details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          description: Password-recovery or outbox feature gate is disabled; endpoint absent.
        '422':
          $ref: '#/components/responses/ResetPasswordValidationError'
        '429':
          $ref: '#/components/responses/PasswordRecoveryRateLimited'
        '503':
          $ref: '#/components/responses/PasswordRecoveryUnavailable'
components:
  securitySchemes:
    anonymousSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: Anonymous Spring Session cookie returned by GET /auth/csrf.
    authenticatedSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly, Redis-backed authenticated planner session.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Token returned by GET /auth/csrf for the same SESSION cookie.
  headers:
    CorrelationId:
      description: Server-generated request correlation ID.
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      additionalProperties: true
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Trimmed and lowercased before validation and lookup.
        password:
          type: string
          format: password
          description: Required and NFC-normalized without trimming before hash comparison.
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/LoginUser'
    LoginUser:
      type: object
      additionalProperties: false
      required: [id, displayName, email, emailVerified, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ACTIVE]
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [id, displayName, email, emailVerified, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ACTIVE]
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          description: Opaque, session-bound CSRF token.
        headerName:
          type: string
          enum: [X-CSRF-TOKEN]
    RegistrationRequest:
      type: object
      additionalProperties: true
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 150
          description: Trimmed before validation and storage.
        email:
          type: string
          format: email
          maxLength: 320
          description: Trimmed and lowercased before validation and storage.
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          description: >-
            Length is measured in Unicode code points after NFC normalization. Spaces are
            retained; control characters are rejected. No character-composition rule applies.
    RegistrationResponse:
      type: object
      additionalProperties: false
      required: [id, displayName, email, emailVerified]
      properties:
        id:
          type: string
          format: uuid
          description: Application-generated UUIDv7.
        displayName:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
          enum: [false]
    EmailVerifyRequest:
      type: object
      additionalProperties: true
      required: [token]
      properties:
        token:
          type: string
          description: Opaque 32-byte base64url token from the URL fragment; never log it.
    VerificationEmailRequest:
      type: object
      additionalProperties: true
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Trimmed and lowercased before account lookup.
    ForgotPasswordRequest:
      type: object
      additionalProperties: true
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Trimmed and lowercased before limiting and lookup.
    ResetPasswordRequest:
      type: object
      additionalProperties: true
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: Opaque 32-byte base64url token from the URL fragment; never log it.
        newPassword:
          type: string
          format: password
          description: >-
            Required; 15 to 128 Unicode code points after NFC normalization, with
            no control characters and no trimming or composition rule.
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
          example: INVALID_FIELD
        message:
          type: string
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    ResetPasswordValidationError:
      description: New password violates the shared password policy (VALIDATION_ERROR).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForgotPasswordValidationError:
      description: Valid JSON with an invalid email (VALIDATION_ERROR).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PasswordRecoveryRateLimited:
      description: Direct-IP limit exceeded (PASSWORD_RECOVERY_RATE_LIMITED); email limits still return 202.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PasswordRecoveryUnavailable:
      description: Required Redis rate limiter or storage is unavailable (PASSWORD_RECOVERY_TEMPORARILY_UNAVAILABLE).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthenticationRequired:
      description: Session is absent, expired, invalidated, or no longer eligible.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.makemymarriage.com/problems/authentication-required
            title: Unauthorized
            status: 401
            detail: Authentication is required.
            instance: /api/v1/users/me
            code: AUTHENTICATION_REQUIRED
            correlationId: c5edb916-641e-4aaa-a7bd-73005ee10bca
    InvalidCredentials:
      description: Generic response for unknown, incorrect, unverified, suspended, or deactivated accounts.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.makemymarriage.com/problems/invalid-credentials
            title: Unauthorized
            status: 401
            detail: Invalid credentials.
            instance: /api/v1/auth/login
            code: INVALID_CREDENTIALS
            correlationId: c5edb916-641e-4aaa-a7bd-73005ee10bca
    AuthenticationRateLimited:
      description: Configured email or direct-IP attempt limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthenticationUnavailable:
      description: Authentication is unavailable because required storage or limiting cannot be used.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VerificationRateLimited:
      description: Too many requests from the direct remote IP (VERIFICATION_RATE_LIMITED).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VerificationUnavailable:
      description: Redis rate limiting is unavailable; no token is issued or consumed (VERIFICATION_TEMPORARILY_UNAVAILABLE).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VerificationEmailValidationError:
      description: Valid JSON with an invalid email address.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.makemymarriage.com/problems/validation-error
            title: Unprocessable Content
            code: VALIDATION_ERROR
            status: 422
            detail: Invalid request fields.
            instance: /api/v1/auth/email/verification-requests
            correlationId: c5edb916-641e-4aaa-a7bd-73005ee10bca
            errors:
              - field: email
                code: INVALID_FIELD
                message: must be a well-formed email address
    InvalidVerificationToken:
      description: Invalid, expired, revoked, reused, or ineligible token (VERIFICATION_TOKEN_INVALID); malformed JSON uses MALFORMED_JSON.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.makemymarriage.com/problems/verification-token-invalid
            title: Bad Request
            code: VERIFICATION_TOKEN_INVALID
            status: 400
            detail: This verification link is invalid or expired.
            instance: /api/v1/auth/email/verify
            correlationId: c5edb916-641e-4aaa-a7bd-73005ee10bca
    MalformedJson:
      description: Invalid JSON request body.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.makemymarriage.com/problems/malformed-json
            title: Bad Request
            code: MALFORMED_JSON
            status: 400
            detail: Request body is not valid JSON.
            instance: /api/v1/auth/register
            correlationId: c5edb916-641e-4aaa-a7bd-73005ee10bca
    CsrfInvalid:
      description: Missing or invalid session-bound CSRF token.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.makemymarriage.com/problems/csrf-invalid
            title: Forbidden
            code: CSRF_INVALID
            status: 403
            detail: A valid CSRF token is required.
            instance: /api/v1/auth/register
            correlationId: c5edb916-641e-4aaa-a7bd-73005ee10bca
    DuplicateEmail:
      description: An account already uses this email, regardless of case.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.makemymarriage.com/problems/email-already-registered
            title: Conflict
            code: EMAIL_ALREADY_REGISTERED
            status: 409
            detail: An account with this email already exists.
            instance: /api/v1/auth/register
            correlationId: c5edb916-641e-4aaa-a7bd-73005ee10bca
    ValidationError:
      description: Valid JSON with invalid registration fields.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.makemymarriage.com/problems/validation-error
            title: Unprocessable Content
            code: VALIDATION_ERROR
            status: 422
            detail: Invalid registration fields.
            instance: /api/v1/auth/register
            correlationId: c5edb916-641e-4aaa-a7bd-73005ee10bca
            errors:
              - field: password
                code: INVALID_FIELD
                message: Use 15 to 128 characters without control characters.
