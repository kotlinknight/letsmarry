name: makemymarriage

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your local environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your local environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.2.9
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    profiles: ["application"]
    image: makemymarriage-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in your local environment file}
      DATABASE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in your local environment file}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment file}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      SERVER_FORWARD_HEADERS_STRATEGY: none
      SPRING_PROFILES_ACTIVE: ${BACKEND_SPRING_PROFILES_ACTIVE:-}
      SERVER_ADDRESS: 0.0.0.0
      EMAIL_OUTBOX_ACTIVE_KEY_ID: ${EMAIL_OUTBOX_ACTIVE_KEY_ID:-}
      EMAIL_OUTBOX_KEYS: ${EMAIL_OUTBOX_KEYS:-}
      EMAIL_OUTBOX_WORKER_ENABLED: ${EMAIL_OUTBOX_WORKER_ENABLED:-false}
      VERIFICATION_RATE_LIMIT_KEY: ${VERIFICATION_RATE_LIMIT_KEY:-}
      VERIFICATION_FRONTEND_URL: ${VERIFICATION_FRONTEND_URL:-http://127.0.0.1:4200/verify-email}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-hello@makemymarriage.local}
    ports:
      - "127.0.0.1:${BACKEND_CONTAINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  frontend:
    profiles: ["application"]
    image: makemymarriage-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_CONTAINER_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  mailpit-data:
