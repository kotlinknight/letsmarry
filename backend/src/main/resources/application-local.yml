# Explicit opt-in for host-run development over loopback HTTP.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/makemymarriage}
    username: ${DATABASE_USERNAME:makemymarriage}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}

server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false

app:
  registration:
    enabled: true
