spring:
  application:
    name: make-my-marriage
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    data:
      redis:
        namespace: makemymarriage:session
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

app:
  authentication:
    enabled: ${AUTHENTICATION_ENABLED:false}
    rate-limit:
      key: ${AUTHENTICATION_RATE_LIMIT_KEY:}
      email-attempts: ${AUTHENTICATION_EMAIL_ATTEMPTS:10}
      ip-attempts: ${AUTHENTICATION_IP_ATTEMPTS:60}
      window-seconds: ${AUTHENTICATION_WINDOW_SECONDS:900}
  registration:
    enabled: false
  verification:
    frontend-url: ${VERIFICATION_FRONTEND_URL:http://127.0.0.1:4200/verify-email}
    rate-limit:
      enabled: ${VERIFICATION_RATE_LIMIT_ENABLED:false}
      key: ${VERIFICATION_RATE_LIMIT_KEY:}
      resend-ip-hourly: ${VERIFICATION_RESEND_IP_HOURLY:30}
      verify-ip-hourly: ${VERIFICATION_VERIFY_IP_HOURLY:20}
  mail:
    from: ${MAIL_FROM:}
  email-outbox:
    enabled: ${EMAIL_OUTBOX_ENABLED:false}
    active-key-id: ${EMAIL_OUTBOX_ACTIVE_KEY_ID:}
    keys: ${EMAIL_OUTBOX_KEYS:}
    worker:
      enabled: ${EMAIL_OUTBOX_WORKER_ENABLED:false}
      poll-delay-ms: 5000
      initial-delay-ms: 5000
